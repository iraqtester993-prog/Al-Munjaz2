<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B6E68">
  <title>المنجز السريع</title>
  <style>
    :root{color-scheme:light;--primary:#0B6E68;--ink:#13201f;--soft:#71817e;--surface:#fff;--bg:#f4f6f5}
    *{box-sizing:border-box}html,body{min-height:100%;margin:0;background:var(--bg);font-family:Cairo,Tahoma,Arial,sans-serif;color:var(--ink)}
    body{min-height:100dvh;display:grid;place-items:center;padding:24px}
    main{width:min(100%,420px);padding:30px 24px;border:1px solid #d8e2e0;border-radius:24px;background:var(--surface);box-shadow:0 18px 42px rgba(12,42,39,.09);text-align:center}
    .mark{width:66px;height:66px;margin:0 auto 18px;border-radius:20px;background:linear-gradient(145deg,#08aca5,var(--primary));display:grid;place-items:center;box-shadow:0 12px 22px rgba(11,110,104,.22)}
    .mark img{width:54px;height:54px;object-fit:contain}.signal{width:10px;height:10px;margin:0 auto 14px;border-radius:50%;background:#e09b32;box-shadow:0 0 0 6px #fff2dc}h1{margin:0 0 9px;font-size:20px;font-weight:900}p{margin:0;color:var(--soft);font-size:13px;line-height:1.9;font-weight:700}button{width:100%;margin-top:22px;padding:12px 16px;border:0;border-radius:13px;background:var(--primary);color:white;font:800 13px inherit;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <div class="mark"><img src="/assets/icon-192.png" alt="المنجز السريع"></div>
    <div class="signal"></div>
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>تحقق من الشبكة ثم حاول مرة أخرى. بيانات الطلبات لا تُعرض دون اتصال لحماية معلوماتك.</p>
    <button type="button" onclick="location.reload()">إعادة المحاولة</button>
  </main>
</body>
</html>
