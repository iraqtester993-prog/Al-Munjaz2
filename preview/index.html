<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>معاينة المنجز</title>
  <style>body{margin:0;background:#f1f7f6;color:#143634;font-family:Arial,sans-serif}.wrap{max-width:800px;margin:10vh auto;padding:28px;text-align:center}.logo{display:inline-grid;place-items:center;width:70px;height:70px;border-radius:20px;background:#087f78;color:#fff;font-size:38px;font-weight:bold}h1{margin:18px 0 8px}p{color:#59706d;line-height:1.8}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:30px}.card{display:block;background:white;border-radius:18px;padding:28px;text-decoration:none;color:#143634;box-shadow:0 8px 22px #0d3f3515}.card b{display:block;font-size:20px;margin-bottom:8px}.note{font-size:13px;margin-top:25px}@media(max-width:600px){.cards{grid-template-columns:1fr}}</style>
</head>
<body><main class="wrap"><div class="logo">م</div><h1>معاينة المنجز</h1><p>نسخة تصميمية تجريبية ببيانات عرض فقط. لا تتصل بقاعدة البيانات ولا تمثل حسابات أو طلبات حقيقية.</p><div class="cards"><a class="card" href="app/"><b>تطبيق المنجز</b><span>واجهة التاجر والمندوب</span></a><a class="card" href="dashboard/"><b>لوحة المنجز</b><span>واجهة الإدارة والتشغيل</span></a></div><p class="note">اكتب أي اسم مستخدم وكلمة مرور للدخول إلى بيانات العرض.</p></main></body>
</html>
